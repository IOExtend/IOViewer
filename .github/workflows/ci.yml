name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore IOViewer.slnx
      - run: dotnet build IOViewer.slnx -c Release --no-restore
      - run: dotnet test IOViewer.slnx -c Release --no-build
      - run: dotnet pack IOViewer.slnx -c Release -p:PackCliForPlatforms=true -o artifacts
      - name: Check package dependencies
        shell: pwsh
        run: |
          ./tools/check-packages.ps1 -PackageDirectory artifacts
          ./tools/test-package-checks.ps1
      - name: Install the Windows CLI and export a scan
        shell: pwsh
        run: ./tools/test-cli-package.ps1 -PackageDirectory artifacts -Rid win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/*.nupkg
          if-no-files-found: error

  cli-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: any
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: packages-windows-latest
          path: artifacts
      - name: Install the CLI and export a scan
        shell: pwsh
        run: ./tools/test-cli-package.ps1 -PackageDirectory artifacts -Rid ${{ matrix.rid }}

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/IOViewer/Viewer
    steps:
      - uses: actions/checkout@v7
      # The e2e global setup exports the fixtures with the CLI (`dotnet run`).
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
      - name: Build the viewer fixture and benchmark tools
        working-directory: .
        run: |
          dotnet build tests/fixtures/viewer/generate-fixtures.cs -c Release
          dotnet build tools/SyntheticModel/SyntheticModel.cs -c Release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/IOViewer/Viewer/package-lock.json
      - run: npm ci
      - run: npm run build
      # dist/viewer.js is committed and embedded in the library: it must match the sources.
      - run: git diff --exit-code dist/
      - run: npm test
      - run: npx playwright install --with-deps chromium firefox
      - run: xvfb-run -a npx playwright test
